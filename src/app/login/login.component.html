<div class="auth-page min-vh-100 d-flex align-items-center justify-content-center">
  <div class="auth-card card shadow-sm w-100">
    <div class="row g-0 h-100">

      <!-- Illustration panel -->
      <div class="col-lg-5 d-none d-lg-flex auth-illustration-panel align-items-center justify-content-center">
        <img src="assets/login-illustration.svg" alt="Login illustration" class="auth-illustration" />
      </div>

      <!-- Form panel -->
      <div class="col-lg-7">
    <div class="card-body p-4">
      <h2 class="card-title text-center mb-4">Login</h2>

      <!-- Success / Error alerts -->
      <div *ngIf="successMessage" class="alert alert-success" role="alert">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            id="email"
            type="email"
            class="form-control"
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            formControlName="email"
            placeholder="you@example.com"
          />
          <div class="invalid-feedback">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Enter a valid email.</span>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            formControlName="password"
            placeholder="••••••"
          />
          <div class="invalid-feedback">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Minimum 6 characters.</span>
          </div>
        </div>

        <!-- Submit -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Login</button>
        </div>

      </form>

      <p class="text-center mt-3 mb-0">
        Don't have an account? <a routerLink="/register">Register</a>
      </p>
      </div>

    </div>
  </div>
</div>
