<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <h2>Login</h2>

  <div>
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="usernameOrEmail" />
    <div *ngIf="loginForm.get('usernameOrEmail')?.invalid && loginForm.get('usernameOrEmail')?.touched">
      <small *ngIf="loginForm.get('usernameOrEmail')?.errors?.['required']">Email is required.</small>
      <small *ngIf="loginForm.get('usernameOrEmail')?.errors?.['email']">Enter a valid email.</small>
    </div>
  </div>

  <div>
    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" />
    <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      <small *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</small>
      <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Minimum 6 characters.</small>
    </div>
  </div>

  <button type="submit" [disabled]="loginForm.invalid">Login</button>
</form>
