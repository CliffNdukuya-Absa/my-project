<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="360" height="360" aria-label="Person unlocking a door to knowledge">

  <!-- Background glow circle -->
  <circle cx="200" cy="180" r="150" fill="rgba(0,0,128,0.06)"/>

  <!-- Large open book base -->
  <ellipse cx="200" cy="300" rx="120" ry="14" fill="#000080" opacity="0.15"/>

  <!-- Book left page -->
  <path d="M80 290 Q80 180 200 170 L200 300 Z" fill="#e8eaf6" stroke="#000080" stroke-width="2"/>
  <!-- Book right page -->
  <path d="M320 290 Q320 180 200 170 L200 300 Z" fill="#dde0f5" stroke="#000080" stroke-width="2"/>
  <!-- Book spine -->
  <line x1="200" y1="170" x2="200" y2="300" stroke="#000080" stroke-width="2.5"/>

  <!-- Lines on left page -->
  <line x1="105" y1="230" x2="185" y2="220" stroke="#9fa8da" stroke-width="1.2"/>
  <line x1="108" y1="244" x2="185" y2="235" stroke="#9fa8da" stroke-width="1.2"/>
  <line x1="110" y1="258" x2="185" y2="250" stroke="#9fa8da" stroke-width="1.2"/>
  <line x1="112" y1="272" x2="185" y2="265" stroke="#9fa8da" stroke-width="1.2"/>

  <!-- Lines on right page -->
  <line x1="215" y1="220" x2="295" y2="230" stroke="#9fa8da" stroke-width="1.2"/>
  <line x1="215" y1="235" x2="292" y2="244" stroke="#9fa8da" stroke-width="1.2"/>
  <line x1="215" y1="250" x2="290" y2="258" stroke="#9fa8da" stroke-width="1.2"/>
  <line x1="215" y1="265" x2="288" y2="272" stroke="#9fa8da" stroke-width="1.2"/>

  <!-- Lock body -->
  <rect x="168" y="95" width="64" height="52" rx="10" fill="#000080"/>
  <!-- Lock shackle -->
  <path d="M182 95 Q182 62 200 62 Q218 62 218 95" stroke="#1a3a6b" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="200" cy="117" r="9" fill="#e8eaf6"/>
  <rect x="196" y="117" width="8" height="14" rx="3" fill="#e8eaf6"/>

  <!-- Key -->
  <circle cx="310" cy="80" r="14" fill="none" stroke="#fdd835" stroke-width="5"/>
  <line x1="324" y1="80" x2="356" y2="80" stroke="#fdd835" stroke-width="5" stroke-linecap="round"/>
  <line x1="344" y1="80" x2="344" y2="92" stroke="#fdd835" stroke-width="4" stroke-linecap="round"/>
  <line x1="354" y1="80" x2="354" y2="90" stroke="#fdd835" stroke-width="4" stroke-linecap="round"/>

  <!-- Stars -->
  <text x="48" y="100" font-size="20" fill="#fdd835">&#9733;</text>
  <text x="330" y="170" font-size="15" fill="#000080">&#9733;</text>
  <text x="60" y="200" font-size="13" fill="#3370cc">&#9733;</text>

  <!-- "Welcome back" text bubble -->
  <rect x="96" y="42" width="142" height="34" rx="10" fill="#000080"/>
  <polygon points="148,76 160,92 172,76" fill="#000080"/>
  <text x="115" y="64" font-size="13" fill="#ffffff" font-weight="bold">Welcome back!</text>
</svg>
