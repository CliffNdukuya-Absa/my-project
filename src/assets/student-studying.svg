<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="380" height="380" aria-label="Student studying with books">
  <!-- Desk -->
  <rect x="60" y="270" width="280" height="14" rx="6" fill="#000080"/>
  <rect x="90" y="284" width="14" height="60" rx="4" fill="#000060"/>
  <rect x="296" y="284" width="14" height="60" rx="4" fill="#000060"/>

  <!-- Books stack on desk -->
  <rect x="220" y="230" width="90" height="18" rx="4" fill="#1a3a6b"/>
  <rect x="215" y="214" width="82" height="18" rx="4" fill="#2255a4"/>
  <rect x="222" y="198" width="74" height="18" rx="4" fill="#3370cc"/>

  <!-- Open book on desk -->
  <ellipse cx="155" cy="265" rx="68" ry="10" fill="#e8eaf6"/>
  <path d="M87 265 Q155 245 223 265" fill="#ffffff" stroke="#000080" stroke-width="1.5"/>
  <line x1="155" y1="247" x2="155" y2="265" stroke="#000080" stroke-width="1.5"/>
  <!-- Book lines -->
  <line x1="100" y1="257" x2="150" y2="253" stroke="#9fa8da" stroke-width="1"/>
  <line x1="102" y1="261" x2="150" y2="258" stroke="#9fa8da" stroke-width="1"/>
  <line x1="162" y1="253" x2="210" y2="257" stroke="#9fa8da" stroke-width="1"/>
  <line x1="162" y1="258" x2="208" y2="261" stroke="#9fa8da" stroke-width="1"/>

  <!-- Chair -->
  <rect x="130" y="310" width="100" height="10" rx="4" fill="#000080"/>
  <rect x="130" y="320" width="10" height="40" rx="3" fill="#000060"/>
  <rect x="220" y="320" width="10" height="40" rx="3" fill="#000060"/>

  <!-- Body -->
  <rect x="148" y="205" width="64" height="70" rx="20" fill="#1565c0"/>

  <!-- Arms -->
  <path d="M148 230 Q110 250 105 265" stroke="#1565c0" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M212 230 Q240 250 225 265" stroke="#1565c0" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Neck -->
  <rect x="172" y="192" width="16" height="18" rx="6" fill="#f5c5a3"/>

  <!-- Head -->
  <ellipse cx="180" cy="170" rx="38" ry="40" fill="#f5c5a3"/>

  <!-- Hair -->
  <ellipse cx="180" cy="138" rx="38" ry="18" fill="#3e2000"/>
  <ellipse cx="145" cy="155" rx="12" ry="20" fill="#3e2000"/>
  <ellipse cx="215" cy="155" rx="12" ry="20" fill="#3e2000"/>

  <!-- Eyes -->
  <ellipse cx="167" cy="168" rx="5" ry="6" fill="#fff"/>
  <ellipse cx="193" cy="168" rx="5" ry="6" fill="#fff"/>
  <circle cx="168" cy="170" r="3" fill="#2c1a00"/>
  <circle cx="194" cy="170" r="3" fill="#2c1a00"/>
  <!-- Pupils shine -->
  <circle cx="170" cy="168" r="1" fill="#fff"/>
  <circle cx="196" cy="168" r="1" fill="#fff"/>

  <!-- Eyebrows (focused) -->
  <path d="M161 160 Q167 156 173 160" stroke="#3e2000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M187 160 Q193 156 199 160" stroke="#3e2000" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M170 182 Q180 190 190 182" stroke="#c0804a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Pencil in hand -->
  <line x1="108" y1="263" x2="90" y2="245" stroke="#fdd835" stroke-width="5" stroke-linecap="round"/>
  <polygon points="90,245 84,238 96,241" fill="#f57f17"/>
  <line x1="84" y1="238" x2="82" y2="235" stroke="#888" stroke-width="2"/>

  <!-- Floating stars (motivational) -->
  <text x="50" y="120" font-size="22" fill="#fdd835">&#9733;</text>
  <text x="310" y="100" font-size="18" fill="#fdd835">&#9733;</text>
  <text x="330" y="160" font-size="14" fill="#000080">&#9733;</text>

  <!-- Thought bubble -->
  <circle cx="235" cy="115" r="6" fill="#e8eaf6" stroke="#000080" stroke-width="1"/>
  <circle cx="250" cy="100" r="9" fill="#e8eaf6" stroke="#000080" stroke-width="1"/>
  <rect x="258" y="72" width="72" height="36" rx="12" fill="#e8eaf6" stroke="#000080" stroke-width="1.5"/>
  <text x="272" y="94" font-size="13" fill="#000080" font-weight="bold">A+</text>
</svg>
